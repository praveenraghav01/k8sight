name: Build & Release

# Build the k8sight desktop app for macOS, Windows and Linux in parallel, then
# create a GitHub Release with the installers attached. You never create the
# release by hand — the workflow builds first and publishes for you. Trigger it
# either way:
#   * push a version tag (e.g. `git push origin v1.4.1`), or
#   * Actions -> Build & Release -> Run workflow on `main`; the version is read
#     from the repo's VERSION file, so it tags `v<VERSION>` and releases at the
#     current commit. (Optionally override with the `version` input.)
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional tag override (e.g. v1.4.2). Leave empty to use the VERSION file.'
        required: false
        type: string

permissions:
  contents: write

# Only one release run per ref at a time; cancel superseded runs.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      # Build every platform even if one fails, so a single flaky OS doesn't
      # block the others. Each matrix leg runs on its own runner in parallel.
      fail-fast: false
      matrix:
        include:
          # macos-14 is Apple Silicon, so the arm64 .dmg builds natively.
          - os: macos-14
            name: macOS (arm64)
            artifact: mac
          - os: windows-latest
            name: Windows (x64)
            artifact: windows
          - os: ubuntu-latest
            name: Linux (x64)
            artifact: linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci --prefix client

      # Gate the release on the test suite — never ship a build whose tests fail.
      - name: Run tests
        run: npm test

      # Never publish an unsigned macOS build: without these secrets the app
      # would be ad-hoc signed and not notarized (Gatekeeper blocks it).
      - name: Require macOS signing and notarization secrets
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::macOS signing/notarization secrets missing:$missing. Refusing to build an unsigned release."
            exit 1
          fi

      # Windows: signed when a code-signing certificate is configured
      # (WIN_CSC_LINK = base64 .pfx, WIN_CSC_KEY_PASSWORD, and the certificate's
      # subject name in the WIN_PUBLISHER_NAME variable so auto-updates verify
      # the signature). Until then the build is unsigned, flagged as a warning.
      - name: Windows signing status
        if: runner.os == 'Windows'
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_PUBLISHER_NAME: ${{ vars.WIN_PUBLISHER_NAME }}
        run: |
          if [ -z "$WIN_CSC_LINK" ]; then
            echo "::warning::Windows build is UNSIGNED: set the WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD secrets and the WIN_PUBLISHER_NAME variable to sign it."
          elif [ -z "$WIN_PUBLISHER_NAME" ]; then
            echo "::error::WIN_CSC_LINK is set but the WIN_PUBLISHER_NAME variable is not; auto-update signature checks need it."
            exit 1
          fi

      - name: Build & package
        # `npm run dist` runs the client build then electron-builder for the
        # host OS. --publish never keeps electron-builder from uploading; the
        # dedicated release job below handles publishing. On Windows with a
        # certificate, publisherName makes electron-updater verify that updates
        # are signed by the same publisher.
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ] && [ -n "$WIN_CSC_LINK" ]; then
            npm run dist -- -c.win.publisherName="$WIN_PUBLISHER_NAME"
          else
            npm run dist
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- macOS code signing + notarization (ignored on Windows/Linux) ---
          # electron-builder imports the base64-encoded Developer ID .p12 from
          # CSC_LINK into a temporary keychain and signs with the Hardened
          # Runtime entitlements in build/. The step above fails the run if
          # these are missing. Passed on macOS only, so Windows never falls
          # back to the Apple certificate. Required repo secrets:
          #   MAC_CSC_LINK               base64 of the Developer ID .p12
          #   MAC_CSC_KEY_PASSWORD       password for that .p12
          #   APPLE_ID                   Apple ID email (notarization)
          #   APPLE_APP_SPECIFIC_PASSWORD  app-specific password
          #   APPLE_TEAM_ID              10-char Developer Team ID
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          # --- Windows code signing (optional until a certificate exists) ---
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          WIN_PUBLISHER_NAME: ${{ vars.WIN_PUBLISHER_NAME }}
          # Consumed by electron/notarize.cjs (afterSign hook).
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: k8sight-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.zip
            release/latest*.yml
            release/*.blockmap

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Manual approval gate: this job targets the `release` environment, which has
    # required reviewers. After every platform builds, the workflow PAUSES here
    # until a reviewer approves it in the Actions run — then it publishes.
    # (Configure reviewers in Settings → Environments → release.)
    environment: release
    # Publish for a pushed tag, or any manual run (version from the VERSION file).
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: ver
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"                 # tag push: reuse it
          elif [ -n "${{ inputs.version }}" ]; then
            TAG="${{ inputs.version }}"                  # manual override
          else
            TAG="v$(tr -d ' \t\r\n' < VERSION)"          # from the VERSION file
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Checksums for every published file, so downloads can be verified
      # (especially the Windows and Linux builds, which aren't signed yet).
      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum *.dmg *.exe *.AppImage *.deb *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          # Reuse a pushed tag; otherwise create this tag + release at this commit.
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: false
          # Shown above the auto-generated notes. The other assets (the .zip,
          # latest*.yml and .blockmap files) are the auto-update feed, which the
          # installed app reads; people installing only need the file below.
          body: |
            ## Download

            | Platform | File |
            |---|---|
            | macOS (Apple Silicon) | **`k8sight-macos.dmg`** |
            | Windows | **`k8sight-windows.exe`** |
            | Linux | **`k8sight-linux.AppImage`** or **`k8sight-linux.deb`** |

            Already installed? k8sight updates itself; the other files here are what it uses to do that.

            Verify a download: compare it with **`SHA256SUMS.txt`** (`shasum -a 256 <file>` on macOS/Linux, `Get-FileHash <file>` on Windows).
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.zip
            dist/latest*.yml
            dist/*.blockmap
            dist/SHA256SUMS.txt
